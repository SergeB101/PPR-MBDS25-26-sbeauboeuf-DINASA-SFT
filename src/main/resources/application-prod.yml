spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  devtools:
    restart:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

server:
  forward-headers-strategy: framework   # adresse IP réelle derrière IIS / nginx

dinasa:
  securite:
    jwt:
      secret: ${JWT_SECRET}
    origines-autorisees: ${ORIGINES_AUTORISEES}

logging:
  level:
    root: INFO